<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heure &amp; Météo — Casablanca</title>
  <style>
    :root {
      --bg-1: #0f2027;
      --bg-2: #203a43;
      --bg-3: #2c5364;
      --card: rgba(255, 255, 255, 0.08);
      --text: #f4f7fa;
      --muted: rgba(244, 247, 250, 0.72);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 2rem 2rem 2.25rem;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    .city {
      font-size: 1.05rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .time {
      font-size: 4rem;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      line-height: 1.05;
    }
    .date { margin-top: 0.5rem; color: var(--muted); font-size: 1rem; }
    .divider { height: 1px; background: rgba(255, 255, 255, 0.15); margin: 1.75rem 0; }
    .weather { display: flex; align-items: center; justify-content: center; gap: 1.25rem; }
    .weather .icon { font-size: 3.25rem; line-height: 1; }
    .temp { font-size: 2.75rem; font-weight: 300; line-height: 1.1; }
    .cond { color: var(--muted); margin-top: 0.2rem; }
    .details {
      display: flex;
      justify-content: space-around;
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .details div { display: flex; flex-direction: column; gap: 0.2rem; }
    .details span:first-child {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .updated { margin-top: 1.75rem; font-size: 0.75rem; color: rgba(244, 247, 250, 0.45); }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="city">Casablanca, Maroc</h1>
    <div class="time" id="time">--:--:--</div>
    <div class="date" id="date">—</div>

    <div class="divider"></div>

    <div class="weather">
      <span class="icon" id="icon">⏳</span>
      <div>
        <div class="temp" id="temp">--°</div>
        <div class="cond" id="cond">Chargement…</div>
      </div>
    </div>

    <div class="details">
      <div><span>Humidité</span><strong id="humidity">--%</strong></div>
      <div><span>Vent</span><strong id="wind">-- km/h</strong></div>
      <div><span>Ressenti</span><strong id="feels">--°</strong></div>
    </div>

    <div class="updated" id="updated"></div>
  </main>

  <script>
    // Coordonnées de Casablanca + fuseau horaire
    const TZ = "Africa/Casablanca";
    const LAT = 33.5731;
    const LON = -7.5898;

    const timeEl = document.getElementById("time");
    const dateEl = document.getElementById("date");
    const iconEl = document.getElementById("icon");
    const tempEl = document.getElementById("temp");
    const condEl = document.getElementById("cond");
    const humidityEl = document.getElementById("humidity");
    const windEl = document.getElementById("wind");
    const feelsEl = document.getElementById("feels");
    const updatedEl = document.getElementById("updated");

    // --- Horloge (heure locale de Casablanca) ---
    function tick() {
      const now = new Date();
      const parts = new Intl.DateTimeFormat("fr-FR", {
        timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
      }).formatToParts(now);
      const get = (t) => (parts.find((p) => p.type === t) || {}).value || "00";
      timeEl.textContent = get("hour") + ":" + get("minute") + ":" + get("second");

      dateEl.textContent = new Intl.DateTimeFormat("fr-FR", {
        timeZone: TZ, weekday: "long", day: "numeric", month: "long", year: "numeric"
      }).format(now);
    }

    // --- Codes météo WMO → [emoji, libellé] ---
    const WEATHER_CODES = {
      0: ["☀️", "Ciel dégagé"],
      1: ["🌤️", "Plutôt dégagé"],
      2: ["⛅", "Partiellement nuageux"],
      3: ["☁️", "Couvert"],
      45: ["🌫️", "Brouillard"],
      48: ["🌫️", "Brouillard givrant"],
      51: ["🌦️", "Bruine légère"],
      53: ["🌦️", "Bruine"],
      55: ["🌦️", "Bruine dense"],
      56: ["🌧️", "Bruine verglaçante"],
      57: ["🌧️", "Bruine verglaçante dense"],
      61: ["🌧️", "Pluie légère"],
      63: ["🌧️", "Pluie"],
      65: ["🌧️", "Pluie forte"],
      66: ["🌨️", "Pluie verglaçante"],
      67: ["🌨️", "Pluie verglaçante forte"],
      71: ["🌨️", "Neige légère"],
      73: ["🌨️", "Neige"],
      75: ["❄️", "Neige forte"],
      77: ["🌨️", "Grains de neige"],
      80: ["🌦️", "Averses légères"],
      81: ["🌧️", "Averses"],
      82: ["⛈️", "Averses violentes"],
      85: ["🌨️", "Averses de neige"],
      86: ["❄️", "Fortes averses de neige"],
      95: ["⛈️", "Orage"],
      96: ["⛈️", "Orage avec grêle"],
      99: ["⛈️", "Orage violent avec grêle"]
    };

    // --- Météo : API gratuite Open-Meteo (sans clé) ---
    async function loadWeather() {
      const url = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT +
        "&longitude=" + LON +
        "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m" +
        "&timezone=" + TZ;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const c = data.current;
        const [icon, label] = WEATHER_CODES[c.weather_code] || ["🌡️", "Météo"];
        iconEl.textContent = icon;
        tempEl.textContent = Math.round(c.temperature_2m) + "°";
        condEl.textContent = label;
        humidityEl.textContent = c.relative_humidity_2m + "%";
        windEl.textContent = Math.round(c.wind_speed_10m) + " km/h";
        feelsEl.textContent = Math.round(c.apparent_temperature) + "°";
        updatedEl.textContent = "Mis à jour à " + new Intl.DateTimeFormat("fr-FR", {
          timeZone: TZ, hour: "2-digit", minute: "2-digit"
        }).format(new Date());
      } catch (err) {
        condEl.textContent = "Météo indisponible";
        updatedEl.textContent = "Erreur : " + err.message;
      }
    }

    tick();
    setInterval(tick, 1000);
    loadWeather();
    setInterval(loadWeather, 10 * 60 * 1000); // rafraîchit toutes les 10 min
  </script>
</body>
</html>
